name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\SFAdaptorFixer.sln

      - name: Test
        run: dotnet test .\SFAdaptorFixer.sln --configuration Release --no-restore

      - name: Publish self-contained build
        run: >
          dotnet publish .\SFAdaptorFixer.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output .\artifacts\self-contained

      - name: Publish framework-dependent build
        run: >
          dotnet publish .\SFAdaptorFixer.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output .\artifacts\framework-dependent

      - name: Package release archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\release | Out-Null
          Compress-Archive `
            -Path .\artifacts\self-contained\* `
            -DestinationPath .\artifacts\release\SFAdaptorFixer-${{ github.ref_name }}-win-x64-self-contained.zip `
            -Force
          Compress-Archive `
            -Path .\artifacts\framework-dependent\* `
            -DestinationPath .\artifacts\release\SFAdaptorFixer-${{ github.ref_name }}-win-x64-framework-dependent.zip `
            -Force

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          .\artifacts\release\SFAdaptorFixer-${{ github.ref_name }}-win-x64-self-contained.zip
          .\artifacts\release\SFAdaptorFixer-${{ github.ref_name }}-win-x64-framework-dependent.zip
          --title "SFAdaptorFixer ${{ github.ref_name }}"
          --generate-notes
