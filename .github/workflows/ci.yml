name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\SFAdaptorFixer.sln

      - name: Build
        run: dotnet build .\SFAdaptorFixer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\SFAdaptorFixer.sln --configuration Release --no-build --no-restore
